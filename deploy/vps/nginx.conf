# nginx site config for usinsurancefundings.com.
# Installed to /etc/nginx/sites-available/usif by deploy/vps/deploy.sh.
# certbot rewrites this file in place when TLS is issued.

server {
    listen 80;
    listen [::]:80;
    server_name usinsurancefundings.com www.usinsurancefundings.com;

    # Next sets its own security headers and redirects (see next.config.ts),
    # so nginx stays a plain reverse proxy and does not duplicate them.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Content-hashed assets — safe to pin. Everything else defers to Next.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;
}
